name: Ableton Release

on:
  push:
    tags: ["ableton-v*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ableton/.nvmrc

      - run: corepack enable

      # Install the web deps so the extension build can produce the offline viewer
      # (ableton/build.ts runs `pnpm build:embed` in ../web and inlines the result).
      - run: corepack pnpm -C web install --frozen-lockfile

      - run: npm --prefix ableton ci

      - run: npm --prefix ableton run package

      - name: Stamp artifact with version
        run: cp ableton/dist/minilogue-xd-viewer.ablx "minilogue-xd-viewer-${GITHUB_REF_NAME}.ablx"

      - uses: softprops/action-gh-release@v2
        with:
          files: minilogue-xd-viewer-*.ablx
          generate_release_notes: true

  # The MIDI bridge is a macOS menu-bar .app (py2app + PyObjC/CoreMIDI), so it must build on macOS.
  # Runs after `extension` so the release already exists — this job only attaches its artifact.
  bridge:
    runs-on: macos-latest
    needs: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # pyobjc/rtmidi wheels + a framework build for py2app

      - name: Build the bridge .app
        working-directory: bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt py2app
          python setup.py py2app

      - name: Zip the .app (ditto preserves the bundle)
        run: ditto -c -k --keepParent bridge/dist/bridge.app "minilogue-xd-bridge-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: minilogue-xd-bridge-*.zip
